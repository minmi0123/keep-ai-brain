<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fef3c7"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d97706" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- 왼쪽: 뇌 -->
  <rect x="24" y="24" width="566" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="58" font-size="20" font-weight="700" fill="#0f172a">뇌 — 계속 남는 기억</text>

  <!-- kb -->
  <rect x="64" y="110" width="236" height="180" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="182" y="150" font-size="26" font-weight="800" fill="#075985" text-anchor="middle">kb</text>
  <text x="182" y="180" font-size="16" font-weight="600" fill="#0c4a6e" text-anchor="middle">AI brain</text>
  <text x="182" y="212" font-size="14" fill="#334155" text-anchor="middle">다시 쓸 사실 · 이슈 · 사고</text>
  <text x="182" y="236" font-size="14" fill="#334155" text-anchor="middle">입구는 INDEX.md</text>
  <text x="182" y="260" font-size="14" fill="#334155" text-anchor="middle">한 사실은 한 곳에만</text>
  <rect x="64" y="300" width="200" height="34" rx="6" fill="url(#hatch)" stroke="#d97706" stroke-width="1.5"/>
  <rect x="72" y="306" width="184" height="22" rx="4" fill="#fffbeb" opacity="0.92"/>
  <text x="164" y="322" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">[확인필요] 질문 목록</text>
  <!-- kb 자가점검 고리 -->
  <path d="M 76 104 A 26 26 0 1 1 112 92" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrowLoop)"/>
  <text x="130" y="88" font-size="14" font-weight="700" fill="#0f766e">자가점검 check-kb</text>

  <!-- memory -->
  <rect x="340" y="110" width="220" height="180" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="150" font-size="26" font-weight="800" fill="#5b21b6" text-anchor="middle">memory</text>
  <text x="450" y="180" font-size="16" font-weight="600" fill="#4c1d95" text-anchor="middle">rules · input analyze</text>
  <text x="450" y="212" font-size="14" fill="#334155" text-anchor="middle">사용자 성향 · 작업 규칙</text>
  <text x="450" y="236" font-size="14" fill="#334155" text-anchor="middle">MEMORY.md = 한 줄 목차</text>
  <text x="450" y="260" font-size="14" fill="#334155" text-anchor="middle">매일 자동 커밋</text>
  <path d="M 352 104 A 26 26 0 1 1 388 92" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrowLoop)"/>
  <text x="406" y="88" font-size="14" font-weight="700" fill="#0f766e">자가점검 check-memory</text>

  <text x="48" y="392" font-size="14" fill="#475569">매주 check-brain 이 세 층을 한 번에 점검 (AI 안 부름 · 토큰 0)</text>

  <!-- 가운데 구분선 -->
  <line x1="610" y1="24" x2="610" y2="424" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 오른쪽: 업무 단위 산출물 -->
  <text x="636" y="58" font-size="20" font-weight="700" fill="#0f172a">업무 노트 <tspan font-size="15" font-weight="600" fill="#475569">(작업 폴더)</tspan></text>
  <text x="636" y="82" font-size="14" fill="#475569">일 하나 = 폴더 하나 · 메모만 (코드 X)</text>

  <rect x="660" y="112" width="300" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="138" font-size="15" font-weight="700" fill="#14532d">261031183024 로그인제한</text>
  <text x="680" y="161" font-size="13" fill="#334155">이어하기.md (지금 상태) · 이력.md (경위)</text>

  <rect x="660" y="194" width="300" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="220" font-size="15" font-weight="700" fill="#14532d">261028101500 주문취소</text>
  <text x="680" y="243" font-size="13" fill="#334155">이어하기.md · 이력.md · 기준표.md</text>

  <rect x="660" y="276" width="300" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="302" font-size="15" font-weight="700" fill="#14532d">261020090000 결제 분석</text>
  <text x="680" y="325" font-size="13" fill="#334155">상태: 완료 · kb 반영: 완료</text>

  <!-- compact-confirm 고리 (위) -->
  <path d="M 916 106 A 24 24 0 1 1 952 100" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrowLoop)"/>
  <text x="900" y="102" font-size="14" font-weight="700" fill="#0f766e" text-anchor="end">compact-confirm</text>
  <!-- 자가점검 고리 (아래) -->
  <path d="M 672 344 A 24 24 0 1 0 708 352" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrowLoop)"/>
  <text x="718" y="392" font-size="14" font-weight="700" fill="#0f766e">자가점검 check-tasks</text>

  <!-- kb-harvest 화살표: 산출물 → 뇌 -->
  <line x1="652" y1="205" x2="572" y2="205" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="566" y="168" width="94" height="26" rx="13" fill="#334155"/>
  <text x="613" y="186" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">kb-harvest</text>

  <!-- 아래: 입력 → AI -->
  <rect x="24" y="452" width="952" height="124" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <rect x="56" y="486" width="150" height="56" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="131" y="511" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">Input</text>
  <text x="131" y="531" font-size="13" fill="#334155" text-anchor="middle">사용자 요청</text>
  <line x1="214" y1="514" x2="290" y2="514" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="252" y="502" font-size="13" fill="#475569" text-anchor="middle">/consult</text>
  <!-- AI 별 -->
  <g transform="translate(330,514)">
    <path d="M0,-30 L8,-8 L30,0 L8,8 L0,30 L-8,8 L-30,0 L-8,-8 Z" fill="#f97316"/>
    <circle r="7" fill="#ffffff"/>
  </g>
  <text x="372" y="508" font-size="16" font-weight="700" fill="#9a3412">AI</text>
  <text x="372" y="530" font-size="13" fill="#334155">질문 먼저 → ①~⑤ 전체 / 검증만</text>
  <text x="620" y="500" font-size="14" font-weight="700" fill="#0f172a">읽기: INDEX.md 부터 → 이어하기.md</text>
  <text x="620" y="524" font-size="14" font-weight="700" fill="#0f172a">쓰기: 작업 폴더 → (다시 쓸 사실만) kb</text>
  <text x="620" y="548" font-size="14" fill="#475569">모든 문서는 md · 사람용이 아니면 AI 가 읽기 쉽게</text>
</svg>
